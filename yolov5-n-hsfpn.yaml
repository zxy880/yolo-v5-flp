# YOLOv5 🚀 by Ultralytics, GPL-3.0 license

# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.25  # layer channel multiple
anchors:
  - [10,12, 20,7, 12,35]      # P3/8
  - [30,22, 52,14, 22,39]     # P4/16
  - [37,38, 58,24, 70,168]    # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],   # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4
   [-1, 3, MBSF, [128, 5]],        # 2-P2 (MBSF 128)
   [-1, 1, HFP, [0.25, 16]],       # 3-HFP (P2 Lateral)

   [2, 1, DCN, [256, 3, 2]],       # 4-P3/8 (DCN) from P2 MBSF
   [-1, 6, MBSF, [256, 5]],        # 5-P3 (MBSF 256)
   [4, 1, nn.Identity, []],        # 6-Identity (P3 无侧向支路)

   [5, 1, Conv, [512, 3, 2]],      # 7-P4/16 (Conv) from P3 MBSF
   [-1, 9, MBSF, [512, 5]],        # 8-P4 (MBSF 512)
   [7, 1, HFP, [0.25, 16]],        # 9-HFP (P4 Lateral) from 7

   [-1, 1, Conv, [1024, 3, 2]],    # 10-P5/32 (Conv)
   [-1, 3, C3, [1024]],            # 11
   [-1, 1, SPPF, [1024, 5]],       # 12-P5
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, 1, 1]],                   # 13 (P5 特征处理)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 14 (P5 上采样)

   [[9, -1], 1, SAR_Fusion_Block, [512]],        # 15 (新融合模块: CSG去噪 + DLDF融合)

   [-1, 1, Conv, [256, 1, 1]],                   # 16 (通道压缩)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 17 (P4 上采样)

   [3, 1, Conv, [256, 3, 2]],                    # 18 (P2 HFP 下采样处理)

   [[18, -1], 1, SAR_Fusion_Block, [256]],       # 19 (新融合模块: CSG去噪 + DLDF融合)

   [-1, 1, Conv, [256, 1, 1]],                   # 20
   [-1, 1, Conv, [256, 3, 2]],                   # 21

   [[-1, 16], 1, Concat, [1]],                   # 22 (Concat P4 路由)

   [-1, 3, C3, [512, False]],                    # 23

   [-1, 1, Conv, [512, 3, 2]],                   # 24

   [[-1, 13], 1, Concat, [1]],                   # 25 (Concat P5 路由)

   [-1, 3, C3, [1024, False]],                   # 26

   [[20, 23, 26], 1, Detect, [nc, anchors]],     # 27
  ]
