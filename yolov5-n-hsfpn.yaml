# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.25  # layer channel multiple
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],   # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4
   [-1, 3, MBSF, [128, 5]],        # 2-P2 (MBSF 128)
   [-1, 1, HFP, [0.25, 16]],       # 3-HFP (P2 Lateral)

   [2, 1, DCN, [256, 3, 2]],       # 4-P3/8 (DCN) from P2 MBSF
   [-1, 6, MBSF, [256, 5]],        # 5-P3 (MBSF 256)
   [4, 1, nn.Identity, []],        # 6-Identity (P3 无侧向支路)

   [5, 1, Conv, [512, 3, 2]],      # 7-P4/16 (Conv) from P3 MBSF
   [-1, 9, MBSF, [512, 5]],        # 8-P4 (MBSF 512)
   [7, 1, HFP, [0.25, 16]],        # 9-HFP (P4 Lateral) from 7

   [-1, 1, Conv, [1024, 3, 2]],    # 10-P5/32 (Conv)
   [-1, 3, C3, [1024]],            # 11
   [-1, 1, SPPF, [1024, 5]],       # 12-P5
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, 1, 1]],                   # 13
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 14
   [[9, -1], 1, SDP, [20, 20]],                  # 15
   [[-1, 14], 1, Concat, [1]],                   # 16 residual concat
   [-1, 1, Conv, [256, 1, 1]],                   # 17 channel adjust
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 18
   [3, 1, Conv, [256, 3, 2]],                    # 19 downsample P2 HFP to P3
   [[19, -1], 1, SDP, [20, 20]],                 # 20
   [[-1, 18], 1, Concat, [1]],                   # 21 residual concat
   [-1, 1, Conv, [256, 1, 1]],                   # 22 channel adjust

   [-1, 1, Conv, [256, 3, 2]],                   # 23 down to P4
   [[-1, 17], 1, Concat, [1]],                   # 24 cat P4 route
   [-1, 3, C3, [512, False]],                    # 25

   [-1, 1, Conv, [512, 3, 2]],                   # 26 down to P5
   [[-1, 13], 1, Concat, [1]],                   # 27 cat P5 route
   [-1, 3, C3, [1024, False]],                   # 28

   [[22, 25, 28], 1, Detect, [nc, anchors]],     # 29
  ]
